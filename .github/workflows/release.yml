name: Build and Release PebbleFix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PebbleFix Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile PebbleFix.exe
        shell: cmd
        run: |
          call build.bat

      - name: Package Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item -Path "PebbleFix.exe" -Destination "release\PebbleFix.exe"
          
          # Create archive with standalone runner and batch scripts
          Compress-Archive -Path "PebbleFix.exe", "scripts\*", "engine\*" -DestinationPath "release\PebbleFix-full.zip" -Force
          
          # Generate SHA256 hashes
          Get-FileHash -Path "release\PebbleFix.exe", "release\PebbleFix-full.zip" -Algorithm SHA256 | Out-File -FilePath "release\SHA256SUMS.txt" -Encoding utf8
          Get-Content "release\SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/PebbleFix.exe
            release/PebbleFix-full.zip
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
